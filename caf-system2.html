<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Culture Acapella Festival — Management System">
<title>CAF · Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* ============================================================
   DESIGN TOKENS — CAF Season 2 palette
   ============================================================ */
:root{
  /* Surfaces */
  --bg:#FDF8F3;
  --surface:#FFFFFF;
  --surface-2:#FBF5EF;
  --surface-3:#F3E7DC;
  --border:#E8D5C4;
  --border-2:#D9C2AC;
  --text:#3F2E2C;
  --text-2:#7A625E;
  --text-3:#A08B86;

  /* Brand accent */
  --primary:#E4572E;
  --primary-2:#D9913F;
  --primary-ink:#B8391A;
  --primary-soft:#FBE9E2;

  /* Semantic */
  --ok:#1F7A4D;        --ok-soft:#D8F0E1;
  --warn:#B8860B;      --warn-soft:#F7ECCB;
  --danger:#B3261E;    --danger-soft:#F9E0DE;
  --info:#7A2228;      --info-soft:#F3E0E2;
  --purple:#B8860B;    --purple-soft:#FAEEDC;
  --neutral:#7A625E;   --neutral-soft:#F3E7DC;

  /* Sidebar */
  --sidebar-bg:#3A0C10;
  --sidebar-bg-2:#4A1215;
  --sidebar-text:#D9C8C2;
  --sidebar-dim:#8B6B68;

  /* Effects */
  --shadow-sm:0 1px 2px rgba(58,12,16,.06);
  --shadow:0 4px 18px rgba(58,12,16,.09);
  --shadow-lg:0 24px 64px rgba(58,12,16,.22);

  --radius:14px;
  --radius-sm:9px;
  --radius-lg:20px;
  --topbar-h:64px;
  --sidebar-w:266px;
  --sidebar-w-collapsed:78px;

  --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
  --font-body:"Comfortaa","Segoe UI",Arial,sans-serif;
}

[data-theme="dark"]{
  --bg:#17090B;
  --surface:#1F0E11;
  --surface-2:#2A1418;
  --surface-3:#341A1E;
  --border:#3A2024;
  --border-2:#4E2F33;
  --text:#EFE3DC;
  --text-2:#B9A29C;
  --text-3:#8B7671;

  --primary:#E4572E;
  --primary-2:#E8B368;
  --primary-ink:#FF9C7A;
  --primary-soft:rgba(228,87,46,.16);

  --ok:#4CC38A;        --ok-soft:rgba(76,195,138,.16);
  --warn:#E0B33A;      --warn-soft:rgba(224,179,58,.16);
  --danger:#F87171;    --danger-soft:rgba(248,113,113,.16);
  --info:#FFB088;      --info-soft:rgba(255,176,136,.14);
  --purple:#E8B368;    --purple-soft:rgba(232,179,104,.16);
  --neutral:#B9A29C;   --neutral-soft:rgba(185,162,156,.14);

  --sidebar-bg:#0F0507;
  --sidebar-bg-2:#1F0E11;
  --sidebar-text:#D9C8C2;
  --sidebar-dim:#6B4F4C;

  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 4px 18px rgba(0,0,0,.45);
  --shadow-lg:0 24px 64px rgba(0,0,0,.6);
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--primary-ink);text-decoration:none}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-family:var(--font-head);letter-spacing:-.01em}
ul{margin:0;padding:0;list-style:none}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box;border:3px solid transparent}

:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{min-height:100vh;min-height:100dvh}

/* ---------- Sidebar ---------- */
.sidebar{
  position:fixed;top:0;bottom:0;left:0;z-index:70;
  width:var(--sidebar-w);
  background:linear-gradient(180deg,var(--sidebar-bg) 0%,var(--sidebar-bg-2) 100%);
  display:flex;flex-direction:column;
  transform:translateX(-100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1), width .22s cubic-bezier(.4,0,.2,1);
  border-right:1px solid rgba(255,255,255,.05);
  will-change:transform;
}
.sidebar.open{transform:translateX(0)}
.sidebar::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(600px 220px at 20% 0%,rgba(228,87,46,.22),transparent 70%),
    radial-gradient(500px 180px at 90% 100%,rgba(217,145,63,.14),transparent 70%);
}

.brand{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;min-height:var(--topbar-h);
  border-bottom:1px solid rgba(255,255,255,.07);
  position:relative;z-index:1;flex:none;
}
.brand-mark{
  width:38px;height:38px;flex:none;border-radius:12px;
  background:linear-gradient(135deg,#E4572E,#D9913F);
  display:grid;place-items:center;
  box-shadow:0 8px 22px rgba(228,87,46,.45);
}
.brand-mark svg{width:26px;height:26px}
.brand-text{min-width:0;overflow:hidden}
.brand-text b{
  display:block;color:#FBF5EF;font-family:var(--font-head);
  font-size:13px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
}
.brand-text span{
  display:block;font-size:10px;color:var(--sidebar-dim);
  letter-spacing:.9px;text-transform:uppercase;font-weight:700;white-space:nowrap;margin-top:2px;
}

.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px 28px;position:relative;z-index:1}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);background-clip:content-box;border:3px solid transparent}
.nav-group{margin-bottom:2px}
.nav-label{
  font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--sidebar-dim);padding:16px 12px 7px;font-weight:700;white-space:nowrap;
}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:9px 12px;border-radius:10px;
  color:var(--sidebar-text);font-size:13px;font-weight:500;
  text-align:left;transition:background .15s,color .15s;position:relative;
  white-space:nowrap;
}
.nav-item .ico{width:18px;height:18px;flex:none;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.06);color:#FBF5EF}
.nav-item.active{
  background:linear-gradient(90deg,rgba(228,87,46,.95),rgba(228,87,46,.4));
  color:#fff;box-shadow:0 8px 22px -6px rgba(228,87,46,.75);
}
.nav-item.active .ico{opacity:1}
.nav-badge{
  margin-left:auto;background:rgba(255,255,255,.15);color:#fff;
  font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;line-height:1.6;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,.28)}

.sidebar-foot{
  flex:none;padding:12px;border-top:1px solid rgba(255,255,255,.07);
  position:relative;z-index:1;
}
.sf-card{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:10px 12px;
}
.sf-card .ico{width:16px;height:16px;color:#4CC38A;flex:none}
.sf-text{min-width:0;overflow:hidden}
.sf-text b{display:block;color:#E8DDD6;font-size:11px;font-weight:600;white-space:nowrap}
.sf-text span{display:block;color:var(--sidebar-dim);font-size:10.5px;white-space:nowrap}

/* ---------- Scrim ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(15,5,7,.6);backdrop-filter:blur(2px);
  z-index:65;opacity:0;pointer-events:none;transition:opacity .25s;
}
.scrim.show{opacity:1;pointer-events:auto}

/* ---------- Main ---------- */
.main{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  transition:margin-left .22s cubic-bezier(.4,0,.2,1);
}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  height:var(--topbar-h);flex:none;
  display:flex;align-items:center;gap:10px;
  padding:0 14px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
@supports (backdrop-filter:blur(1px)){
  .topbar{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px) saturate(160%)}
}

.icon-btn{
  width:38px;height:38px;flex:none;border-radius:10px;
  display:grid;place-items:center;color:var(--text-2);
  transition:background .15s,color .15s;position:relative;
}
.icon-btn:hover{background:var(--surface-3);color:var(--primary-ink)}
.icon-btn .ico{width:18px;height:18px}
.icon-btn .ping{
  position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--primary);border:2px solid var(--surface);
}

.season-switch{
  display:flex;align-items:center;gap:10px;
  padding:6px 10px 6px 8px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);
  transition:border-color .15s,background .15s;max-width:260px;
}
.season-switch:hover{border-color:var(--border-2);background:var(--surface-3)}
.season-dot{
  width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;
  box-shadow:0 0 0 3px var(--ok-soft);
}
.season-meta{min-width:0;text-align:left;overflow:hidden}
.season-meta b{display:block;font-size:12.5px;font-weight:700;line-height:1.25;white-space:nowrap;font-family:var(--font-head);color:var(--heading)}
.season-meta small{display:block;font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.season-switch .chev{width:14px;height:14px;color:var(--text-3);flex:none}

.search-trigger{
  flex:1;max-width:420px;margin-left:6px;
  display:flex;align-items:center;gap:9px;
  height:38px;padding:0 12px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface-2);
  color:var(--text-3);font-size:12.5px;text-align:left;
  transition:border-color .15s,background .15s;
}
.search-trigger:hover{border-color:var(--border-2);background:var(--surface-3)}
.search-trigger .ico{width:16px;height:16px;flex:none}
.search-trigger span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-trigger kbd{
  font-family:var(--font-head);font-size:10.5px;font-weight:700;
  padding:2px 6px;border-radius:6px;background:var(--surface);
  border:1px solid var(--border);color:var(--text-3);
}

.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.user{
  display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;
  border-radius:12px;transition:background .15s;
}
.user:hover{background:var(--surface-3)}
.avatar{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,#E4572E,#D9913F);
  color:#fff;display:grid;place-items:center;
  font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:.4px;
}
.user-meta{text-align:left;overflow:hidden}
.user-meta b{display:block;font-size:12.5px;font-weight:600;line-height:1.3;white-space:nowrap}
.user-meta small{display:block;font-size:10.5px;color:var(--text-3);white-space:nowrap}

/* ---------- Content ---------- */
.content{
  flex:1;padding:22px 20px 60px;
  max-width:1600px;width:100%;margin:0 auto;
}

/* ============================================================
   COMPONENTS
   ============================================================ */
.page-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:20px;
}
.page-head h1{
  font-family:var(--font-head);
  font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.2;
  color:var(--heading);
}
.page-head p{font-size:13px;color:var(--text-2);margin-top:4px;max-width:640px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  height:37px;padding:0 14px;border-radius:10px;
  font-family:var(--font-body);font-size:12.5px;font-weight:700;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--surface-3);border-color:var(--border-2)}
.btn .ico{width:15px;height:15px}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  border-color:transparent;color:#fff;
  box-shadow:0 6px 18px -6px rgba(228,87,46,.85);
}
.btn-primary:hover{filter:brightness(1.07);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--primary-ink)}
.btn-sm{height:32px;padding:0 11px;font-size:12px;border-radius:9px}
.btn-sm .ico{width:14px;height:14px}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
  overflow:hidden;
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.card-head h3{
  font-family:var(--font-head);font-size:14px;font-weight:700;
  letter-spacing:-.1px;display:flex;align-items:center;gap:8px;
  color:var(--heading);
}
.card-head h3 .ico{width:16px;height:16px;color:var(--primary-ink)}
.card-head p{font-size:12px;color:var(--text-3);margin-top:2px}
.card-body{padding:18px}
.card-body.tight{padding:0}

.grid{display:grid;gap:16px}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.grid-2{grid-template-columns:1fr}
.grid-3{grid-template-columns:1fr}
.grid-2-1{grid-template-columns:1fr}

/* KPI */
.kpi{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 17px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-2)}
.kpi::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--primary-2));
}
.kpi.ok::before{background:linear-gradient(90deg,#1F7A4D,#4CC38A)}
.kpi.warn::before{background:linear-gradient(90deg,#B8860B,#E8B368)}
.kpi.danger::before{background:linear-gradient(90deg,#B3261E,#F87171)}
.kpi.info::before{background:linear-gradient(90deg,#7A2228,#E4572E)}

.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.kpi-label{
  font-family:var(--font-head);
  font-size:11px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.7px;
}
.kpi-ico{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--primary-soft);color:var(--primary-ink);
}
.kpi-ico .ico{width:15px;height:15px}
.kpi.ok .kpi-ico{background:var(--ok-soft);color:var(--ok)}
.kpi.warn .kpi-ico{background:var(--warn-soft);color:var(--warn)}
.kpi.danger .kpi-ico{background:var(--danger-soft);color:var(--danger)}
.kpi.info .kpi-ico{background:var(--info-soft);color:var(--info)}
.kpi-value{
  font-family:var(--font-head);
  font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.1;
  color:var(--heading);
}
.kpi-foot{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;color:var(--text-3)}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:11.5px}
.delta.up{color:var(--ok)}
.delta.down{color:var(--danger)}
.delta .ico{width:12px;height:12px}

/* Badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:20px;
  font-family:var(--font-body);
  font-size:11px;font-weight:700;letter-spacing:.1px;white-space:nowrap;
  background:var(--neutral-soft);color:var(--neutral);
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge.green{background:var(--ok-soft);color:var(--ok)}
.badge.blue{background:var(--info-soft);color:var(--info)}
.badge.amber{background:var(--warn-soft);color:var(--warn)}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.badge.purple{background:var(--purple-soft);color:var(--purple)}
.badge.gray{background:var(--neutral-soft);color:var(--neutral)}
.badge.outline{background:transparent;border:1px solid var(--border-2);color:var(--text-2)}

/* Tables */
.table-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:920px}
thead th{
  position:sticky;top:0;z-index:3;
  background:var(--surface-2);
  text-align:left;font-family:var(--font-head);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--text-3);font-weight:700;padding:10px 14px;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
tbody tr:hover{background:var(--surface-3)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cell-strong{font-weight:600;color:var(--heading)}
.cell-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.cell-group{display:flex;align-items:center;gap:10px}
.mini-avatar{
  width:30px;height:30px;border-radius:9px;flex:none;
  display:grid;place-items:center;font-family:var(--font-head);
  font-size:11px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#E4572E,#D9913F);
}
.mini-avatar.alt{background:linear-gradient(135deg,#7A2228,#E4572E)}
.mini-avatar.alt2{background:linear-gradient(135deg,#B8860B,#E8B368)}
.mini-avatar.alt3{background:linear-gradient(135deg,#5E181D,#B8860B)}

.check{
  appearance:none;width:16px;height:16px;border-radius:5px;
  border:1.5px solid var(--border-2);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;flex:none;transition:.15s;
}
.check:checked{background:var(--primary);border-color:var(--primary)}
.check:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}

/* Toolbar */
.toolbar{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--border);background:var(--surface);
}
.input-wrap{
  display:flex;align-items:center;gap:8px;flex:1;min-width:190px;max-width:340px;
  height:36px;padding:0 12px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface-2);
  transition:border-color .15s,box-shadow .15s;
}
.input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input-wrap .ico{width:15px;height:15px;color:var(--text-3);flex:none}
.input-wrap input{flex:1;border:0;background:none;outline:none;font-size:12.5px;min-width:0;color:var(--heading)}
.input-wrap input::placeholder{color:var(--text-3)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:700;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  transition:.15s;white-space:nowrap;
}
.chip:hover{border-color:var(--border-2);background:var(--surface-3)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px -4px rgba(228,87,46,.8)}

.bulkbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;background:var(--primary-soft);
  border-bottom:1px solid var(--border);
  font-size:12px;font-weight:700;color:var(--primary-ink);
}

.pager{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap;
  font-size:12px;color:var(--text-2);
}
.pager-btns{display:flex;gap:4px}
.pg{
  min-width:32px;height:32px;padding:0 9px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  font-size:12px;font-weight:700;display:grid;place-items:center;transition:.15s;
}
.pg:hover{border-color:var(--border-2);background:var(--surface-3)}
.pg.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* Funnel */
.funnel{display:flex;flex-direction:column;gap:11px}
.funnel-row{display:flex;align-items:center;gap:12px}
.funnel-label{width:88px;flex:none;font-size:12px;font-weight:700;color:var(--text-2)}
.funnel-track{flex:1;height:30px;border-radius:9px;background:var(--surface-3);overflow:hidden;position:relative}
.funnel-fill{
  height:100%;border-radius:9px;
  background:linear-gradient(90deg,#5E181D,#E4572E);
  display:flex;align-items:center;justify-content:flex-end;padding-right:10px;
  color:#fff;font-size:11px;font-weight:700;
  transition:width 1s cubic-bezier(.4,0,.2,1);
  min-width:44px;
}
.funnel-row:nth-child(2) .funnel-fill{background:linear-gradient(90deg,#7A2228,#E4572E)}
.funnel-row:nth-child(3) .funnel-fill{background:linear-gradient(90deg,#B8391A,#E4572E)}
.funnel-row:nth-child(4) .funnel-fill{background:linear-gradient(90deg,#B8860B,#E8B368)}
.funnel-row:nth-child(5) .funnel-fill{background:linear-gradient(90deg,#1F7A4D,#4CC38A)}
.funnel-val{width:56px;flex:none;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--heading)}

/* Action queue */
.queue{display:flex;flex-direction:column}
.queue-item{
  display:flex;align-items:center;gap:12px;padding:12px 18px;
  border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer;
}
.queue-item:last-child{border-bottom:0}
.queue-item:hover{background:var(--surface-2)}
.queue-ico{
  width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
}
.queue-ico .ico{width:16px;height:16px}
.queue-ico.amber{background:var(--warn-soft);color:var(--warn)}
.queue-ico.red{background:var(--danger-soft);color:var(--danger)}
.queue-ico.blue{background:var(--info-soft);color:var(--info)}
.queue-ico.purple{background:var(--purple-soft);color:var(--purple)}
.queue-text{flex:1;min-width:0}
.queue-text b{display:block;font-size:12.5px;font-weight:700;color:var(--heading)}
.queue-text span{display:block;font-size:11px;color:var(--text-3);margin-top:1px}
.queue-count{
  font-family:var(--font-head);
  font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--primary-ink);
}

/* Activity feed */
.feed{display:flex;flex-direction:column;padding:6px 0}
.feed-item{display:flex;gap:12px;padding:10px 18px;position:relative}
.feed-item::before{
  content:"";position:absolute;left:29px;top:32px;bottom:-6px;width:1.5px;background:var(--border);
}
.feed-item:last-child::before{display:none}
.feed-dot{
  width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--primary-soft);color:var(--primary-ink);z-index:1;
  border:3px solid var(--surface);
}
.feed-dot .ico{width:11px;height:11px}
.feed-dot.green{background:var(--ok-soft);color:var(--ok)}
.feed-dot.amber{background:var(--warn-soft);color:var(--warn)}
.feed-dot.red{background:var(--danger-soft);color:var(--danger)}
.feed-body{flex:1;min-width:0;padding-top:1px}
.feed-body p{font-size:12px;line-height:1.55;color:var(--text)}
.feed-body p b{font-weight:700;color:var(--heading)}
.feed-time{font-size:10.5px;color:var(--text-3);margin-top:2px}

/* Progress */
.prog{height:7px;border-radius:20px;background:var(--surface-3);overflow:hidden;width:100%}
.prog-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width 1s cubic-bezier(.4,0,.2,1)}
.prog-fill.green{background:linear-gradient(90deg,#1F7A4D,#4CC38A)}
.prog-fill.amber{background:linear-gradient(90deg,#B8860B,#E8B368)}
.prog-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.prog-row .name{width:150px;flex:none;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--heading)}
.prog-row .prog{flex:1}
.prog-row .val{width:60px;flex:none;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-2)}

/* Bars */
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding:8px 0 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{
  width:100%;max-width:54px;border-radius:9px 9px 4px 4px;
  background:linear-gradient(180deg,var(--primary-2),var(--primary));
  transition:height 1s cubic-bezier(.4,0,.2,1);position:relative;
}
.bar-col:nth-child(2) .bar{background:linear-gradient(180deg,#4CC38A,#1F7A4D)}
.bar-col:nth-child(3) .bar{background:linear-gradient(180deg,#E8B368,#B8860B)}
.bar-col:nth-child(4) .bar{background:linear-gradient(180deg,#E4572E,#7A2228)}
.bar-col:nth-child(5) .bar{background:linear-gradient(180deg,#B8391A,#5E181D)}
.bar-label{font-size:10.5px;color:var(--text-3);font-weight:700;text-align:center;white-space:nowrap}
.bar-val{font-size:11.5px;font-weight:700;color:var(--text-2)}

/* Chart */
.chart-wrap{width:100%;overflow:hidden}
.chart-wrap svg{width:100%;height:190px;display:block}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 2px 4px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);font-weight:600}
.legend-swatch{width:10px;height:10px;border-radius:3px}

/* Tabs */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);overflow-x:auto;padding:0 4px}
.tab{
  padding:11px 14px;font-size:12.5px;font-weight:700;color:var(--text-3);
  border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;
  font-family:var(--font-body);
}
.tab:hover{color:var(--heading)}
.tab.active{color:var(--primary-ink);border-bottom-color:var(--primary)}

/* Inbox */
.inbox{display:grid;grid-template-columns:1fr;min-height:520px}
.thread-list{border-right:1px solid var(--border);max-height:600px;overflow-y:auto}
.thread{
  display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.thread:hover{background:var(--surface-2)}
.thread.active{background:var(--primary-soft);border-left:3px solid var(--primary);padding-left:12px}
.thread-body{flex:1;min-width:0}
.thread-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.thread-top b{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--heading)}
.thread-top span{font-size:10.5px;color:var(--text-3);flex:none}
.thread-preview{font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.thread-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.channel-tag{
  font-size:10px;font-weight:700;padding:1.5px 7px;border-radius:20px;letter-spacing:.3px;
  background:var(--surface-3);color:var(--text-2);
}
.channel-tag.wa{background:var(--ok-soft);color:var(--ok)}
.channel-tag.sms{background:var(--info-soft);color:var(--info)}
.channel-tag.email{background:var(--purple-soft);color:var(--purple)}

.chat{display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.chat-body{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:420px;background:var(--surface-2)}
.bubble{max-width:78%;padding:11px 14px;border-radius:14px;font-size:12.5px;line-height:1.55;position:relative}
.bubble.in{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px;align-self:flex-start}
.bubble.out{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
  border-bottom-right-radius:5px;align-self:flex-end;
}
.bubble .meta{font-size:10.5px;opacity:.65;margin-top:5px;display:block}
.chat-input{display:flex;gap:9px;padding:13px 16px;border-top:1px solid var(--border);align-items:center}
.chat-input input{
  flex:1;height:40px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface-2);padding:0 14px;outline:none;font-size:12.5px;min-width:0;color:var(--heading);
}
.chat-input input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

/* Programme */
.prog-grid{display:grid;grid-template-columns:1fr;gap:14px}
.day-col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.day-head{padding:11px 14px;background:var(--surface-3);border-bottom:1px solid var(--border)}
.day-head b{font-size:12.5px;font-weight:700;display:block;color:var(--heading);font-family:var(--font-head)}
.day-head span{font-size:11px;color:var(--text-3)}
.slot{
  display:flex;align-items:center;gap:10px;padding:10px 13px;
  border-bottom:1px solid var(--border);font-size:12.5px;
}
.slot:last-child{border-bottom:0}
.slot-time{width:56px;flex:none;font-size:11px;font-weight:700;color:var(--primary-ink);font-variant-numeric:tabular-nums;font-family:var(--font-head)}
.slot-body{flex:1;min-width:0}
.slot-body b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--heading)}
.slot-body span{display:block;font-size:11px;color:var(--text-3)}
.slot.conflict{background:var(--danger-soft)}
.slot.conflict .slot-time{color:var(--danger)}

/* Integration cards */
.int-card{
  display:flex;align-items:center;gap:13px;padding:15px 16px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  transition:.18s;
}
.int-card:hover{border-color:var(--border-2);box-shadow:var(--shadow-sm)}
.int-logo{
  width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-family:var(--font-head);font-size:14px;font-weight:800;color:#fff;letter-spacing:-.5px;
}
.int-body{flex:1;min-width:0}
.int-body b{display:block;font-size:12.5px;font-weight:700;color:var(--heading)}
.int-body span{display:block;font-size:11px;color:var(--text-3);margin-top:1px}
.int-status{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ok)}
.int-status.off{color:var(--text-3)}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 45%,transparent)}
  70%{box-shadow:0 0 0 7px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}

/* Portal preview */
.portal-preview{
  max-width:400px;margin:0 auto;background:var(--surface);
  border:1px solid var(--border);border-radius:26px;overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.pp-head{
  padding:16px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
}
.pp-head b{display:block;font-size:15px;font-weight:700;font-family:var(--font-head)}
.pp-head span{display:block;font-size:12px;opacity:.9;margin-top:2px}
.pp-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.tl-item{display:flex;gap:12px;padding-bottom:16px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:8px;top:20px;bottom:0;width:1.5px;background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-dot{width:17px;height:17px;border-radius:50%;flex:none;border:3px solid var(--surface);z-index:1;background:var(--border-2)}
.tl-dot.done{background:var(--ok)}
.tl-dot.now{background:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.tl-text b{display:block;font-size:12px;font-weight:700;color:var(--heading)}
.tl-text span{display:block;font-size:11px;color:var(--text-3);margin-top:1px}

/* Command palette */
.cmdk{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:flex-start;justify-content:center;
  padding:12vh 16px 16px;background:rgba(15,5,7,.6);backdrop-filter:blur(4px);
}
.cmdk.show{display:flex}
.cmdk-box{
  width:100%;max-width:600px;background:var(--surface);
  border:1px solid var(--border-2);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
.cmdk-input{
  display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--border);
}
.cmdk-input .ico{width:18px;height:18px;color:var(--text-3);flex:none}
.cmdk-input input{flex:1;border:0;background:none;outline:none;font-size:14px;min-width:0;color:var(--heading)}
.cmdk-input kbd{
  font-family:var(--font-head);font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;
  background:var(--surface-3);border:1px solid var(--border);color:var(--text-3);
}
.cmdk-list{max-height:52vh;overflow-y:auto;padding:8px}
.cmdk-group{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--text-3);padding:10px 12px 5px}
.cmdk-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  cursor:pointer;font-size:12.5px;font-weight:600;transition:background .12s;width:100%;text-align:left;
  color:var(--text);
}
.cmdk-item .ico{width:17px;height:17px;color:var(--text-3);flex:none}
.cmdk-item.sel,.cmdk-item:hover{background:var(--primary-soft);color:var(--primary-ink)}
.cmdk-item.sel .ico,.cmdk-item:hover .ico{color:var(--primary)}
.cmdk-item .hint{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:700}
.cmdk-empty{padding:34px 18px;text-align:center;color:var(--text-3);font-size:12.5px}

/* Dropdown */
.dd{
  position:absolute;top:calc(var(--topbar-h) - 8px);z-index:120;
  background:var(--surface);border:1px solid var(--border-2);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);
  min-width:250px;overflow:hidden;display:none;
  animation:pop .15s ease-out;
}
.dd.show{display:block}
.dd-head{padding:12px 15px;border-bottom:1px solid var(--border);font-family:var(--font-head);font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;font-weight:700;color:var(--text-3)}
.dd-item{
  display:flex;align-items:center;gap:11px;padding:11px 15px;width:100%;text-align:left;
  font-size:12.5px;transition:background .12s;color:var(--text);
}
.dd-item:hover{background:var(--surface-2)}
.dd-item.active{background:var(--primary-soft)}
.dd-item .ico{width:16px;height:16px;color:var(--text-3);flex:none}
.dd-item-body{flex:1;min-width:0}
.dd-item-body b{display:block;font-size:12.5px;font-weight:700;color:var(--heading)}
.dd-item-body span{display:block;font-size:11px;color:var(--text-3)}
.dd-sep{height:1px;background:var(--border);margin:5px 0}

.notif{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.notif:last-child{border-bottom:0}
.notif:hover{background:var(--surface-2)}
.notif-ico{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center}
.notif-ico .ico{width:15px;height:15px}
.notif-body{flex:1;min-width:0}
.notif-body p{font-size:12px;line-height:1.45;color:var(--text)}
.notif-body p b{color:var(--heading)}
.notif-body span{font-size:10.5px;color:var(--text-3);display:block;margin-top:2px}

/* Toast */
.toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border-2);
  border-left:3px solid var(--ok);
  padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);
  font-size:12.5px;font-weight:600;min-width:230px;max-width:340px;color:var(--heading);
  animation:slideIn .25s ease-out;
}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.toast .ico{width:16px;height:16px;color:var(--ok);flex:none}
.toast.info{border-left-color:var(--primary)}
.toast.info .ico{color:var(--primary)}

/* Misc */
.empty{padding:48px 20px;text-align:center}
.empty .ico{width:38px;height:38px;color:var(--text-3);margin:0 auto 12px;opacity:.6}
.empty b{display:block;font-size:13.5px;font-weight:700;margin-bottom:4px;color:var(--heading)}
.empty p{font-size:12px;color:var(--text-3);max-width:320px;margin:0 auto 14px}

.stat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.stat-row:last-child{border-bottom:0}
.stat-row .lbl{color:var(--text-2)}
.stat-row .val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--heading)}

.section-title{font-family:var(--font-head);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--text-3);margin-bottom:12px}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (min-width:640px){
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .prog-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:24px 24px 60px}
}
@media (min-width:900px){
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-2-1{grid-template-columns:1.55fr 1fr}
  .inbox{grid-template-columns:320px 1fr}
}
@media (min-width:1024px){
  .sidebar{transform:translateX(0)}
  .scrim{display:none}
  .main{margin-left:var(--sidebar-w)}
  .only-mobile{display:none!important}
  .content{padding:26px 28px 70px}

  body.collapsed .sidebar{width:var(--sidebar-w-collapsed)}
  body.collapsed .main{margin-left:var(--sidebar-w-collapsed)}
  body.collapsed .brand-text,
  body.collapsed .nav-label,
  body.collapsed .nav-item .lbl,
  body.collapsed .nav-badge,
  body.collapsed .sf-text{display:none}
  body.collapsed .nav-item{justify-content:center;padding:11px 0}
  body.collapsed .brand{justify-content:center;padding:16px 0}
  body.collapsed .sf-card{justify-content:center;padding:10px 0}
}
@media (min-width:1280px){
  .prog-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:1023px){
  .only-desktop{display:none!important}
  .user-meta{display:none}
  .search-trigger span,.search-trigger kbd{display:none}
  .search-trigger{flex:none;width:38px;padding:0;justify-content:center;max-width:none}
  .season-meta small{display:none}
  .season-meta b{font-size:12px}
}
@media (max-width:560px){
  .content{padding:16px 14px 60px}
  .page-head h1{font-size:19px}
  .kpi-value{font-size:22px}
  .topbar{padding:0 10px;gap:6px}
  .season-switch{padding:5px 8px}
  .card-head{padding:13px 14px}
  .card-body{padding:14px}
  .toolbar{padding:11px 13px}
  .page-actions{width:100%}
  .page-actions .btn{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="app">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 42 42" fill="none">
          <path d="M7 30 L13 24 L19 30 L25 24 L31 30 L36 26" stroke="#FBF5EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
          <path d="M14 22 V13 M19 22 V10 M24 22 V13 M29 22 V16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <b>CAF Management</b>
        <span>Singing to Save Lives</span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Main navigation"></nav>

/* ---- chart helpers ---- */
function smoothPath(pts){
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const [x0,y0] = pts[i], [x1,y1] = pts[i+1];
    const cx = (x0+x1)/2;
    d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;
  }
  return d;
}
function areaChart(values, labels, color, fill){
  const w=600,h=190,pad={t:16,r:8,b:26,l:8};
  const max = Math.max(...values)*1.15 || 1;
  const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
  const pts = values.map((v,i)=>[
    pad.l + (i/(values.length-1))*iw,
    pad.t + ih - (v/max)*ih
  ]);
  const line = smoothPath(pts);
  const area = `${line} L${pts[pts.length-1][0]},${pad.t+ih} L${pts[0][0]},${pad.t+ih} Z`;
  const gid = 'g'+Math.random().toString(36).slice(2,7);

  const grid = [0,1,2,3].map(i=>{
    const y = pad.t + (ih/3)*i;
    return `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="${i===3?'0':'3 5'}"/>`;
  }).join('');

  const labelEls = labels.map((l,i)=>{
    const x = pad.l + (i/(labels.length-1))*iw;
    return `<text x="${x}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--text-3)" font-family="inherit" font-weight="700">${l}</text>`;
  }).join('');

  const dots = pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--surface)" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"><title>${labels[i]}: ${values[i].toLocaleString()}</title></circle>`).join('');

  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Trend chart">
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${fill}" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="${fill}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${grid}
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      ${labelEls}
    </svg>
  </div>`;
}

/* ---- toast ---- */
function toast(msg, tone=''){
  const el = document.createElement('div');
  el.className = 'toast ' + tone;
  el.innerHTML = `${icon(tone==='info'?'zap':'check')}<span>${msg}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{
    el.style.transition='opacity .3s, transform .3s';
    el.style.opacity='0';
    el.style.transform='translateX(16px)';
    setTimeout(()=>el.remove(),300);
  }, 2600);
}

      ${g.items.map(it=>`
        <button class="nav-item ${state.view===it.view?'active':''}" data-view="${it.view}">

      `).join('')}

}

function render(){
  renderNav();
  const fn = VIEWS[state.view] || VIEWS.dashboard;
  $('#view').innerHTML = fn();
  bindView();
  window.scrollTo({top:0,behavior:'instant'});
}

function bindView(){
  $$('[data-filter]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.filter = b.dataset.filter;
      state.q = $('#regSearch') ? $('#regSearch').value : state.q;
      render();
    });
  });

  const s = $('#regSearch');
  if(s){
    s.addEventListener('input',()=>{
      state.q = s.value;
      clearTimeout(window.__qT);
      window.__qT = setTimeout(()=>{
        const pos = s.selectionStart;
        render();
        const ns = $('#regSearch');
        if(ns){ ns.focus(); ns.setSelectionRange(pos,pos); }
      },220);
    });
  }

  $$('.row-check').forEach(c=>{
    c.addEventListener('change',()=>{
      if(c.checked) state.selected.add(c.dataset.code);
      else state.selected.delete(c.dataset.code);
      render();
    });
  });
  const all = $('#checkAll');
  if(all){
    all.addEventListener('change',()=>{
      state.selected.clear();
      if(all.checked) REGS.forEach(r=>state.selected.add(r.code));
      render();
    });
  }

  $$('[data-bulk]').forEach(b=>{
    b.addEventListener('click',()=>{
      const a = b.dataset.bulk;
      if(a==='clear'){ state.selected.clear(); render(); return; }
      toast(`${state.selected.size} registrations updated · notifications queued`);
      state.selected.clear();
      render();
    });
  });

  $$('[data-thread]').forEach(t=>{
    t.addEventListener('click',()=>{
      state.thread = +t.dataset.thread;
      render();
    });
  });

  $$('[data-act]').forEach(b=>{
    b.addEventListener('click',()=>{
      const a = b.dataset.act;
      const msgs = {
        export:'Export queued — you will receive a download link',
        'new-reg':'Manual registration form opened',
        'new-season':'New season wizard opened',
        nudge:'Reminder sent to 3 judges with outstanding scores',
        publish:'Results published · notifications queued',
        reconcile:'Reconciliation started · 312 records queued',
        'manual-pay':'Manual payment form opened',
        template:'Template library opened',
        campaign:'Campaign builder opened',
        schedule:'Report schedule settings opened',
        impact:'Sponsor impact report generating…',
        upload:'Bulk media upload opened',
        'new-page':'New page editor opened',
        edit:'Editor opened',
        preview:'Portal preview opened in a new tab',
        magic:'Magic link sent to group leader',
        'test-all':'Testing 6 integrations…',
        save:'Settings saved',
        'send-reply':'Reply sent on the original channel',
        view:'Opening record…'
      };
      toast(msgs[a] || 'Action completed', a==='export'||a==='test-all'?'info':'');
    });
  });
}

/* ============================================================
   SEASON SWITCHER
   ============================================================ */
function renderSeasonDD(){
  $('#seasonDD').innerHTML = `
    <div class="dd-head">Switch season</div>
    ${SEASONS.map(s=>`
      <button class="dd-item ${state.season===s.id?'active':''}" data-season="${s.id}">
        <span class="season-dot" style="background:${s.state==='Live'?'var(--ok)':s.state==='Draft'?'var(--warn)':'var(--text-3)'}"></span>
        <span class="dd-item-body">
          <b>${s.name}</b>
          <span>${s.theme}</span>
        </span>
        ${badge(s.state,false)}
      </button>
    `).join('')}
    <div class="dd-sep"></div>
    <button class="dd-item" data-act="new-season">
      ${icon('plus')}
      <span class="dd-item-body"><b>Create new season</b><span>Clone settings from an existing season</span></span>
    </button>
  `;
  $$('[data-season]').forEach(b=>{
    b.addEventListener('click',()=>{
      const s = SEASONS.find(x=>x.id===b.dataset.season);
      state.season = s.id;
      $('#seasonName').textContent = s.name;
      $('#seasonTheme').textContent = s.theme;
      $('#seasonDot').style.background = s.state==='Live'?'var(--ok)':s.state==='Draft'?'var(--warn)':'var(--text-3)';
      closeDD();
      renderSeasonDD();
      render();
      toast(`Switched to ${s.name}`, 'info');
    });
  });
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
let cmdkIndex = 0;
let cmdkItems = COMMANDS.slice();

function openCmdk(){
  $('#cmdk').classList.add('show');
  const inp = $('#cmdkInput');
  inp.value = '';
  cmdkItems = COMMANDS.slice();
  cmdkIndex = 0;
  renderCmdk();
  setTimeout(()=>inp.focus(),40);
}
function closeCmdk(){
  $('#cmdk').classList.remove('show');
}
function renderCmdk(){
  const list = $('#cmdkList');
  if(!cmdkItems.length){
    list.innerHTML = `<div class="cmdk-empty">No results found</div>`;
    return;
  }
  let html = '';
  let lastGroup = '';
  cmdkItems.forEach((c,i)=>{
    if(c.group !== lastGroup){
      html += `<div class="cmdk-group">${c.group}</div>`;
      lastGroup = c.group;
    }
    html += `<button class="cmdk-item ${i===cmdkIndex?'sel':''}" data-idx="${i}">
      ${icon(c.icon)}
      <span>${c.label}</span>
      ${c.view?'<span class="hint">↵</span>':''}
    </button>`;
  });
  list.innerHTML = html;

  $$('.cmdk-item').forEach(el=>{
    el.addEventListener('click',()=>runCmdk(+el.dataset.idx));
  });
}
function runCmdk(i){
  const c = cmdkItems[i];
  if(!c) return;
  closeCmdk();
  if(c.view){
    state.view = c.view;
    render();
    return;
  }
  const actions = {
    'new-season':()=>toast('New season wizard opened','info'),
    'new-reg':()=>toast('Manual registration form opened','info'),
    export:()=>toast('Export queued — download link sent to your email','info'),
    campaign:()=>{ state.view='communications'; render(); toast('Campaign builder opened','info'); },
    impact:()=>toast('Sponsor impact report generating…','info'),
    theme:()=>toggleTheme()
  };
  (actions[c.action] || (()=>toast('Action completed')))();
}

/* ============================================================
   DROPDOWNS
   ============================================================ */
function closeDD(){
  $('#seasonDD').classList.remove('show');
  $('#bellDD').classList.remove('show');
  $('#seasonBtn').setAttribute('aria-expanded','false');
}

function positionDD(el, anchor){
  const r = anchor.getBoundingClientRect();
  el.style.left = Math.min(r.left, window.innerWidth - el.offsetWidth - 12) + 'px';
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  const ic = $('#themeIcon');
  ic.innerHTML = state.theme === 'dark' ? ICONS.sun : ICONS.moon;
  try{ localStorage.setItem('caf-theme', state.theme); }catch(e){}
}
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  toast(state.theme === 'dark' ? 'Dark theme enabled' : 'Light theme enabled','info');
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  applyTheme();

  $('#themeBtn').addEventListener('click', toggleTheme);

  const openSidebar = ()=>{
    $('#sidebar').classList.add('open');
    $('#scrim').classList.add('show');
  };
  const closeSidebar = ()=>{
    $('#sidebar').classList.remove('open');
    $('#scrim').classList.remove('show');
  };
  $('#menuBtn').addEventListener('click', openSidebar);
  $('#scrim').addEventListener('click', closeSidebar);

  $('#collapseBtn').addEventListener('click', ()=>{
    document.body.classList.toggle('collapsed');
    state.collapsed = document.body.classList.contains('collapsed');
  });

  $('#nav').addEventListener('click', e=>{
    const btn = e.target.closest('[data-view]');
    if(!btn) return;
    state.view = btn.dataset.view;
    state.selected.clear();
    render();
    if(window.innerWidth < 1024) closeSidebar();
  });

  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-view]');
    if(b && !b.closest('#nav')){
      state.view = b.dataset.view;
      render();
    }
  });

  const sBtn = $('#seasonBtn');
  sBtn.addEventListener('click', e=>{
    e.stopPropagation();
    const dd = $('#seasonDD');
    const isOpen = dd.classList.contains('show');
    closeDD();
    if(!isOpen){
      dd.classList.add('show');
      positionDD(dd, sBtn);
      sBtn.setAttribute('aria-expanded','true');
    }
  });

  const bBtn = $('#bellBtn');
  bBtn.addEventListener('click', e=>{
    e.stopPropagation();
    const dd = $('#bellDD');
    const isOpen = dd.classList.contains('show');
    closeDD();
    if(!isOpen){
      dd.classList.add('show');
      const r = bBtn.getBoundingClientRect();
      dd.style.left = 'auto';
      dd.style.right = '14px';
      dd.style.top = (r.bottom + 8) + 'px';
    }
  });

  document.addEventListener('click', e=>{
    if(!e.target.closest('.dd') && !e.target.closest('#seasonBtn') && !e.target.closest('#bellBtn')){
      closeDD();
    }
  });

  $('#searchBtn').addEventListener('click', openCmdk);
  $('#cmdk').addEventListener('click', e=>{
    if(e.target === $('#cmdk')) closeCmdk();
  });
  $('#cmdkInput').addEventListener('input', e=>{
    const q = e.target.value.toLowerCase().trim();
    cmdkItems = COMMANDS.filter(c=>c.label.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
    cmdkIndex = 0;
    renderCmdk();
  });

  document.addEventListener('keydown', e=>{
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      $('#cmdk').classList.contains('show') ? closeCmdk() : openCmdk();
      return;
    }
    if(e.key === 'Escape'){
      closeCmdk(); closeDD();
      if(window.innerWidth < 1024) closeSidebar();
      return;
    }
    if($('#cmdk').classList.contains('show')){
      if(e.key === 'ArrowDown'){
        e.preventDefault();
        cmdkIndex = Math.min(cmdkIndex+1, cmdkItems.length-1);
        renderCmdk();
      }
      if(e.key === 'ArrowUp'){
        e.preventDefault();
        cmdkIndex = Math.max(cmdkIndex-1, 0);
        renderCmdk();
      }
      if(e.key === 'Enter'){
        e.preventDefault();
        runCmdk(cmdkIndex);
      }
    }
  });

  window.addEventListener('resize', ()=>{
    if($('#seasonDD').classList.contains('show')) positionDD($('#seasonDD'), sBtn);
  });

  renderSeasonDD();
  renderBellDD();
  render();
}

boot();
</script>
</body>
</html>
